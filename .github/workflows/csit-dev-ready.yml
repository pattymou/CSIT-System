name: CSIT DEV ready gate

on:
  push:
    tags:
      - 'dev-ready-*'

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/ApprovalFramework.Tests/ApprovalFramework.Tests.csproj
      - name: Build
        run: dotnet build tests/ApprovalFramework.Tests/ApprovalFramework.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/ApprovalFramework.Tests/ApprovalFramework.Tests.csproj -c Release --no-build --no-restore
