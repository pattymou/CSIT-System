name: CSIT KM A-D Mock E2E

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Feature branch or commit containing the complete Mock E2E implementation'
        required: true
        default: 'feature/km-stage-integration'
  pull_request:
    paths:
      - 'contracts/csit-km-integration-v1/**'
      - 'Controllers/KmIntegrationController.cs'
      - 'Data/**'
      - 'Entities/**'
      - 'Migrations/**'
      - 'Models/Api/**'
      - 'Models/Config/**'
      - 'Services/KmIntegration/**'
      - 'Services/Implementations/**'
      - 'tests/ApprovalFramework.Tests/**'
      - 'tools/km-mock-e2e/**'
      - '.github/workflows/csit-km-mock-e2e.yml'

permissions:
  contents: read

concurrency:
  group: csit-km-mock-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-e2e:
    name: Three-round isolated PostgreSQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: csit-mock-e2e-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      KmIntegration__Enabled: 'false'
      KmIntegration__VendorEnabled: 'false'
      KmIntegration__EquipmentEnabled: 'false'
      KmDeletion__Enabled: 'false'
      KmDeletion__VendorEnabled: 'false'
      KmDeletion__EquipmentEnabled: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Install EF tool
        shell: pwsh
        run: dotnet tool install --global dotnet-ef --version 10.0.1
      - name: Restore and build once
        shell: pwsh
        run: |
          dotnet restore tests/ApprovalFramework.Tests/ApprovalFramework.Tests.csproj
          dotnet build tests/ApprovalFramework.Tests/ApprovalFramework.Tests.csproj -c Release --no-restore
      - name: Verify incomplete-test Gate fails closed
        shell: pwsh
        run: tools/km-mock-e2e/Test-KmMockE2EGate.ps1
      - name: Mock E2E round 1
        continue-on-error: true
        shell: pwsh
        run: tools/km-mock-e2e/Invoke-KmMockE2ERound.ps1 -Round 1 -RunId '${{ github.run_id }}' -PostgresPassword 'csit-mock-e2e-only' -AllowEphemeralGitHubService
      - name: Mock E2E round 2
        continue-on-error: true
        shell: pwsh
        run: tools/km-mock-e2e/Invoke-KmMockE2ERound.ps1 -Round 2 -RunId '${{ github.run_id }}' -PostgresPassword 'csit-mock-e2e-only' -AllowEphemeralGitHubService
      - name: Mock E2E round 3
        continue-on-error: true
        shell: pwsh
        run: tools/km-mock-e2e/Invoke-KmMockE2ERound.ps1 -Round 3 -RunId '${{ github.run_id }}' -PostgresPassword 'csit-mock-e2e-only' -AllowEphemeralGitHubService
      - name: Build coverage matrix and enforce acceptance
        if: always()
        shell: pwsh
        run: tools/km-mock-e2e/New-KmMockE2EReport.ps1 -Enforce
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csit-km-a-d-mock-e2e-${{ github.run_id }}
          path: artifacts/km-mock-e2e
          if-no-files-found: error
          retention-days: 30
